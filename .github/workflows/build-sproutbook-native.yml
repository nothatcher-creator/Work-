name: Build SproutBook Native APK

on:
  push:
    branches: [sproutbook-native-v200-godot]
    paths:
      - 'sproutbook_native/**'
      - '.github/workflows/build-sproutbook-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.7.2 and export templates
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -r /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Validate Godot project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path sproutbook_native --editor --quit

      - name: Smoke test native UI
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path sproutbook_native --quit-after 8 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Invalid call|Invalid access|Failed to load script" smoke.log; then
            echo "Native UI smoke test found a script/runtime error."
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p sproutbook_native/build
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path sproutbook_native --export-debug Android build/SproutBook-v200-native.apk
          test -s sproutbook_native/build/SproutBook-v200-native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SproutBook-v200-Native-APK
          path: sproutbook_native/build/SproutBook-v200-native.apk
          if-no-files-found: error
