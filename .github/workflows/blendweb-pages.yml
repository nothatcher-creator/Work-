name: Deploy BlendWeb to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/blendweb-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "blendweb-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BlendWeb source
        uses: actions/checkout@v6
        with:
          ref: blendweb-web

      - name: Validate JavaScript
        run: node --check app.js

      - name: Reject invalid DOM collection calls
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('app.js', 'utf8');
          const bad = [...s.matchAll(/(?<!\$)\$\([^\)\n]+\)\.(forEach|map|filter|some|every|reduce)\b/g)];
          if (bad.length) {
            console.error('Single-element $() selector used as a collection:');
            for (const m of bad) console.error(m[0]);
            process.exit(1);
          }
          console.log('DOM collection selector check passed');
          NODE

      - name: Validate browser dependencies
        run: |
          curl -fsSL --retry 3 --max-time 30 https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js -o /dev/null
          curl -fsSL --retry 3 --max-time 30 https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/environments/RoomEnvironment.js -o /dev/null
          curl -fsSL --retry 3 --max-time 30 https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/lights/RectAreaLightUniformsLib.js -o /dev/null
          curl -fsSL --retry 3 --max-time 30 https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/helpers/RectAreaLightHelper.js -o /dev/null
          curl -fsSL --retry 3 --max-time 30 https://cdn.jsdelivr.net/npm/jsblender@0.0.4/+esm -o /dev/null

      - name: Build isolated Pages artifact
        run: |
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg .nojekyll _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
