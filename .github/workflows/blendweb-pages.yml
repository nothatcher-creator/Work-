name: Deploy BlendWeb to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/blendweb-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "blendweb-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BlendWeb source
        uses: actions/checkout@v6
        with:
          ref: blendweb-web

      - name: Validate JavaScript
        run: node --check app.js

      - name: Build isolated Pages artifact
        run: |
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg .nojekyll _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
