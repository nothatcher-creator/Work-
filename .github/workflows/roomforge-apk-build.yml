name: RoomForge APK Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-roomforge:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct RoomForge source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/roomforge
          cat roomforge-build/chunks/part00.b64 \
              roomforge-build/chunks/part01.b64 \
              roomforge-build/chunks/part02a.b64 \
              roomforge-build/chunks/part02b.b64 \
              roomforge-build/chunks/part03.b64 \
              roomforge-build/chunks/part04.b64 \
              roomforge-build/chunks/part05.b64 \
              roomforge-build/chunks/part06.b64 \
              roomforge-build/chunks/part07.b64 \
              roomforge-build/chunks/part08.b64 \
              roomforge-build/chunks/part09.b64 \
              roomforge-build/chunks/part10a.b64 \
              roomforge-build/chunks/part10b.b64 \
            | tr -d '\r\n ' \
            | base64 --decode > /tmp/roomforge/source.zip
          test "$(wc -c < /tmp/roomforge/source.zip)" -eq 63249
          unzip -t /tmp/roomforge/source.zip
          unzip -q /tmp/roomforge/source.zip -d /tmp/roomforge/src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Patch build compatibility
        working-directory: /tmp/roomforge/src/RoomForgeScanner-v0.5.0
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > app/build.gradle.kts
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/roomforge/scanner/ui/RoomForgeApp.kt"); s=p.read_text(); s=s.replace("colorScheme = if (isSystemInDarkTheme()) darkColorScheme() else lightColorScheme()","colorScheme = lightColorScheme()"); s=s.replace("ExtendedFloatingActionButton(onClick = onNewScan, text = { Text(\"New room scan\") })","ExtendedFloatingActionButton(onClick = onNewScan) { Text(\"New room scan\") }"); p.write_text(s)'
          echo '' | base64 --decode > app/src/main/AndroidManifest.xml
          sed -n '1,120p' app/build.gradle.kts
          cat app/src/main/AndroidManifest.xml

      - name: Apply live AR mesh upgrade
        working-directory: /tmp/roomforge/src/RoomForgeScanner-v0.5.0
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/roomforge-build/patches/LiveTsdfPreviewMesher.kt" app/src/main/java/com/roomforge/scanner/scanner/LiveTsdfPreviewMesher.kt
          cp "$GITHUB_WORKSPACE/roomforge-build/patches/LiveScanMeshNode.kt" app/src/main/java/com/roomforge/scanner/ui/LiveScanMeshNode.kt
          python3 "$GITHUB_WORKSPACE/roomforge-build/patches/apply_live_mesh_patch.py"
          grep -n "versionName" app/build.gradle.kts
          grep -n "LiveScanMeshNode\|liveMesh()" app/src/main/java/com/roomforge/scanner/ui/RoomForgeApp.kt app/src/main/java/com/roomforge/scanner/scanner/DepthRoomScanner.kt

      - name: Apply dense instant 3D upgrade
        working-directory: /tmp/roomforge/src/RoomForgeScanner-v0.5.0
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/roomforge-build/patches/apply_dense_depth_patch.py"
          grep -n "versionName\|versionCode" app/build.gradle.kts
          grep -n "AUTOMATIC\|planeRenderer = false\|acquireDepthImage16Bits\|isDenseDepth"             app/src/main/java/com/roomforge/scanner/ui/RoomForgeApp.kt             app/src/main/java/com/roomforge/scanner/scanner/DepthRoomScanner.kt             app/src/main/java/com/roomforge/scanner/scanner/VoxelGrid.kt

      - name: Build RoomForge debug APK
        working-directory: /tmp/roomforge/src/RoomForgeScanner-v0.5.0
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RoomForgeScanner-v0.7.0-debug
          path: /tmp/roomforge/src/RoomForgeScanner-v0.5.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
