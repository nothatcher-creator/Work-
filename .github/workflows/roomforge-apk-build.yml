name: RoomForge APK Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-roomforge:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct RoomForge source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/roomforge
          cat roomforge-build/chunks/part00.b64 \
              roomforge-build/chunks/part01.b64 \
              roomforge-build/chunks/part02a.b64 \
              roomforge-build/chunks/part02b.b64 \
              roomforge-build/chunks/part03.b64 \
              roomforge-build/chunks/part04.b64 \
              roomforge-build/chunks/part05.b64 \
              roomforge-build/chunks/part06.b64 \
              roomforge-build/chunks/part07.b64 \
              roomforge-build/chunks/part08.b64 \
              roomforge-build/chunks/part09.b64 \
              roomforge-build/chunks/part10a.b64 \
              roomforge-build/chunks/part10b.b64 \
            | tr -d '\r\n ' \
            | base64 --decode > /tmp/roomforge/source.zip
          test "$(wc -c < /tmp/roomforge/source.zip)" -eq 63249
          unzip -t /tmp/roomforge/source.zip
          unzip -q /tmp/roomforge/source.zip -d /tmp/roomforge/src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Patch build compatibility
        working-directory: /tmp/roomforge/src/RoomForgeScanner-v0.5.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("app/build.gradle.kts"); s=p.read_text(); s=s.replace("compileSdk = 37","compileSdk = 36").replace("targetSdk = 37","targetSdk = 36"); s=s.replace("    implementation(platform(\"androidx.compose:compose-bom:2026.09.00\"))\\n",""); s=s.replace("implementation(\"androidx.compose.ui:ui\")","implementation(\"androidx.compose.ui:ui:1.11.4\")"); s=s.replace("implementation(\"androidx.compose.ui:ui-tooling-preview\")","implementation(\"androidx.compose.ui:ui-tooling-preview:1.11.4\")"); s=s.replace("implementation(\"androidx.compose.foundation:foundation\")","implementation(\"androidx.compose.foundation:foundation:1.11.4\")"); s=s.replace("implementation(\"androidx.compose.material3:material3\")","implementation(\"androidx.compose.material3:material3:1.4.0\")"); s=s.replace("debugImplementation(\"androidx.compose.ui:ui-tooling\")","debugImplementation(\"androidx.compose.ui:ui-tooling:1.11.4\")"); s=s.replace("io.github.sceneview:arsceneview:4.37.0","io.github.sceneview:arsceneview:4.33.0"); s=s.replace("dependencies {","dependencies {\\n    implementation(\"androidx.core:core:1.17.0\")\\n    implementation(\"androidx.core:core-ktx:1.17.0\")",1) if "androidx.core:core-ktx:1.17.0" not in s else s; s += "\\nconfigurations.all {\\n    resolutionStrategy.force(\\n        \"androidx.core:core:1.17.0\",\\n        \"androidx.core:core-ktx:1.17.0\"\\n    )\\n}\\n"; p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/roomforge/scanner/ui/RoomForgeApp.kt"); s=p.read_text(); s=s.replace("import androidx.compose.foundation.background\\n","import androidx.compose.foundation.background\\nimport androidx.compose.foundation.isSystemInDarkTheme\\n") if "import androidx.compose.foundation.isSystemInDarkTheme" not in s else s; s=s.replace("ExtendedFloatingActionButton(onClick = onNewScan, text = { Text(\"New room scan\") })","ExtendedFloatingActionButton(onClick = onNewScan) { Text(\"New room scan\") }"); p.write_text(s)'
          grep -E "compileSdk|targetSdk|sceneview|core-ktx|material3" app/build.gradle.kts

      - name: Build RoomForge debug APK
        working-directory: /tmp/roomforge/src/RoomForgeScanner-v0.5.0
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RoomForgeScanner-v0.5.0-debug
          path: /tmp/roomforge/src/RoomForgeScanner-v0.5.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
