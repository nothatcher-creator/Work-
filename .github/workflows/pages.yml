name: Validate and publish BlendWeb

on:
  push:
    branches: ["blendweb-web"]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - ".nojekyll"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: "blendweb-source"
  cancel-in-progress: true

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BlendWeb source
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: node --check app.js

      - name: Verify site files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
          test -f .nojekyll

      - name: Trigger Pages deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run blendweb-pages.yml --ref main
